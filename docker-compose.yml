# Основное окружение приложения.
# Запуск:   cp .env.example .env  &&  docker compose up -d --build
# С логами в Graylog: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

x-spring-service: &spring-service
  restart: unless-stopped
  stop_grace_period: 30s

services:
  # ---------- Подключаемые ресурсы (backing services) ----------
  auth-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  company-vacancy-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${COMPVAC_DB_NAME}
      POSTGRES_USER: ${COMPVAC_DB_USERNAME}
      POSTGRES_PASSWORD: ${COMPVAC_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - company-vacancy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka в режиме KRaft (без Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------- Сервисы приложения ----------
  auth-service:
    <<: *spring-service
    build:
      context: ./auth-service
    image: vacancy-platform/auth-service:${APP_VERSION:-dev}
    deploy:
      replicas: ${AUTH_REPLICAS:-2}
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      YC_ACCESS_KEY: ${YC_ACCESS_KEY}
      YC_SECRET_KEY: ${YC_SECRET_KEY}
      YC_BUCKET_NAME: ${YC_BUCKET_NAME}
      YC_REGION: ${YC_REGION}

  company-vacancy-service:
    <<: *spring-service
    build:
      context: ./company-vacancy-service
    image: vacancy-platform/company-vacancy-service:${APP_VERSION:-dev}
    deploy:
      replicas: ${COMPVAC_REPLICAS:-2}
    depends_on:
      company-vacancy-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://company-vacancy-db:5432/${COMPVAC_DB_NAME}
      DB_USERNAME: ${COMPVAC_DB_USERNAME}
      DB_PASSWORD: ${COMPVAC_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  notification-service:
    <<: *spring-service
    build:
      context: ./notification-service
    image: vacancy-platform/notification-service:${APP_VERSION:-dev}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend/my-app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: vacancy-platform/frontend:${APP_VERSION:-dev}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      auth-service:
        condition: service_healthy
      company-vacancy-service:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  auth-db-data:
  company-vacancy-db-data:
  redis-data:
  kafka-data:
