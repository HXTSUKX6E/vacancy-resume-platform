# Вся конфигурация, отличающаяся между окружениями, берётся из переменных окружения (12 факторов, III).
spring.application.name=notification-service
server.port=${PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Базовый адрес фронтенда, используется в ссылках из писем
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.config=classpath:logback-spring.xml
