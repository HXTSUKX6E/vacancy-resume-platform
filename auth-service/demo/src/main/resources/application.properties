# Вся конфигурация, отличающаяся между окружениями, берётся из переменных окружения (12 факторов, III).
# Значения по умолчанию подходят только для локального запуска; секреты значений по умолчанию не имеют.
spring.application.name=auth-service
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AuthDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Схема БД управляется миграциями Liquibase, Hibernate только проверяет соответствие
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

yandex.s3.access-key=${YC_ACCESS_KEY}
yandex.s3.secret-key=${YC_SECRET_KEY}
yandex.s3.bucket-name=${YC_BUCKET_NAME}
yandex.s3.region=${YC_REGION:ru-central1}

jwt.secret.key=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Учётная запись администратора, создаваемая при первом запуске (если пользователей ещё нет)
admin.login=${ADMIN_LOGIN:}
admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.config=classpath:logback-spring.xml
